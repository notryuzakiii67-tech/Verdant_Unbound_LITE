# shaders.properties - Verdant — Unbound Lite
# Minecraft 1.21.11 | Iris | Fabulously Optimized

# Basic Information
shaderpack.name=Verdant — Unbound Lite
shaderpack.author=Verdant Team
shaderpack.version=1.1.0
shaderpack.description=Original shaderpack optimized for NVIDIA GeForce 940MX with Complementary Unbound visual identity (3D aurora, super good lightweight shadows, godrays, round sun/moon, lightweight water reflection)
shaderpack.compatibility=Iris 1.21.11, Sodium, Fabulously Optimized

# Rendering Pipeline Configuration
# G-Buffers (Geometry pass)
gbuffers.terrain.program=gbuffers_terrain
gbuffers.entities.program=gbuffers_entities
gbuffers.water.program=gbuffers_water
gbuffers.sky.program=gbuffers_sky
gbuffers.clouds.program=gbuffers_clouds
gbuffers.weather.program=gbuffers_weather

# Composite (Post-processing passes)
composite.program=composite
composite1.program=composite1
composite2.program=composite2
final.program=final

# Shadow Pass
shadow.program=shadow
shadowcomp.program=shadowcomp

# Performance Presets
profile.potato=presets/potato.txt
profile.lite=presets/lite.txt
profile.balanced_ultra_lite=presets/balanced_ultra_lite.txt
profile.quality=presets/quality.txt

# Default Profile
profile.default=balanced_ultra_lite

# Shader Options - Main Settings
# Quality preset selection
option.preset.title=Quality Preset
option.preset.type=list
option.preset.values=potato,lite,balanced_ultra_lite,quality
option.preset.default=balanced_ultra_lite

# Master shader toggle
option.master_toggle.title=Master Shader Toggle
option.master_toggle.type=boolean
option.master_toggle.default=true

# Performance mode
option.performance_mode.title=Performance Mode
option.performance_mode.type=boolean
option.performance_mode.default=false

# Lighting Options
option.sunlight_quality.title=Sunlight Quality
option.sunlight_quality.type=list
option.sunlight_quality.values=low,medium,high
option.sunlight_quality.default=medium

option.moonlight.title=Moonlight
option.moonlight.type=boolean
option.moonlight.default=true

option.ambient_occlusion.title=Ambient Occlusion
option.ambient_occlusion.type=list
option.ambient_occlusion.values=off,low,medium,high
option.ambient_occlusion.default=medium

option.light_intensity.title=Light Intensity
option.light_intensity.type=slider
option.light_intensity.min=0.5
option.light_intensity.max=1.5
option.light_intensity.step=0.1
option.light_intensity.default=1.0

option.color_grading.title=Color Grading
option.color_grading.type=boolean
option.color_grading.default=true

# Shadows Options (Super Good Lightweight)
option.shadow_quality.title=Shadow Quality
option.shadow_quality.type=list
option.shadow_quality.values=low,medium,high
option.shadow_quality.default=medium

option.shadow_distance.title=Shadow Distance
option.shadow_distance.type=slider
option.shadow_distance.min=4
option.shadow_distance.max=16
option.shadow_distance.step=1
option.shadow_distance.default=8

option.soft_shadows.title=Super Good Lightweight Shadows
option.soft_shadows.type=boolean
option.soft_shadows.default=true

option.entity_shadows.title=Entity Shadows
option.entity_shadows.type=boolean
option.entity_shadows.default=true

# Water Options (Lightweight Reflection)
option.water_quality.title=Water Quality
option.water_quality.type=list
option.water_quality.values=low,medium,high
option.water_quality.default=medium

option.reflections.title=Lightweight Water Reflection
option.reflections.type=boolean
option.reflections.default=true

option.water_animation.title=Water Animation
option.water_animation.type=boolean
option.water_animation.default=true

option.underwater_effects.title=Underwater Effects
option.underwater_effects.type=boolean
option.underwater_effects.default=true

# Clouds and Sky Options (3D Aurora, Godrays, Round Sun/Moon)
option.cloud_quality.title=Cloud Quality
option.cloud_quality.type=list
option.cloud_quality.values=low,medium,high
option.cloud_quality.default=medium

option.cloud_animation.title=Cloud Animation
option.cloud_animation.type=boolean
option.cloud_animation.default=true

option.cloud_shadows.title=Cloud Shadows
option.cloud_shadows.type=boolean
option.cloud_shadows.default=true

option.sky_effects.title=Sky Effects
option.sky_effects.type=boolean
option.sky_effects.default=true

option.stars.title=Stars
option.stars.type=boolean
option.stars.default=true

option.aurora_effect.title=3D Animated Aurora (Lightweight)
option.aurora_effect.type=boolean
option.aurora_effect.default=true

option.godrays.title=Godrays (Lightweight)
option.godrays.type=boolean
option.godrays.default=true

# Environment Options
option.fog.title=Atmospheric Fog
option.fog.type=boolean
option.fog.default=true

option.vegetation_movement.title=Vegetation Movement
option.vegetation_movement.type=boolean
option.vegetation_movement.default=true

option.rain_effects.title=Rain Effects
option.rain_effects.type=boolean
option.rain_effects.default=true

option.snow_effects.title=Snow Effects
option.snow_effects.type=boolean
option.snow_effects.default=true

option.weather_lighting.title=Weather Lighting
option.weather_lighting.type=boolean
option.weather_lighting.default=true

# Post-processing Options
option.bloom.title=Bloom
option.bloom.type=boolean
option.bloom.default=true

option.tonemapping.title=Tonemapping
option.tonemapping.type=boolean
option.tonemapping.default=true

option.exposure.title=Exposure
option.exposure.type=slider
option.exposure.min=0.5
option.exposure.max=1.5
option.exposure.step=0.1
option.exposure.default=1.0

option.vignette.title=Vignette
option.vignette.type=boolean
option.vignette.default=true

option.color_saturation.title=Color Saturation
option.color_saturation.type=slider
option.color_saturation.min=0.5
option.color_saturation.max=1.5
option.color_saturation.step=0.1
option.color_saturation.default=1.0

option.contrast.title=Contrast
option.contrast.type=slider
option.contrast.min=0.5
option.contrast.max=1.5
option.contrast.step=0.1
option.contrast.default=1.0

# Performance Options
option.performance_mode_advanced.title=Advanced Performance Mode
option.performance_mode_advanced.type=boolean
option.performance_mode_advanced.default=false

option.reduced_resolution_effects.title=Reduced Resolution Effects
option.reduced_resolution_effects.type=boolean
option.reduced_resolution_effects.default=true

option.shadow_optimization.title=Shadow Optimization
option.shadow_optimization.type=boolean
option.shadow_optimization.default=true

option.effect_toggles.title=Effect Toggles
option.effect_toggles.type=boolean
option.effect_toggles.default=true

# Dimension Support
dimension.overworld.enabled=true
dimension.nether.enabled=true
dimension.end.enabled=true

# Blend Modes and Rendering
blend.mode=src_alpha,one_minus_src_alpha
depth.test=true
cull.face=back

# Compatibility Settings
iris.compatibility=true
sodium.compatibility=true
fabulously_optimized.compatibility=true

# Version Information
shaderpack.minecraft_version=1.21.11
shaderpack.iris_version=1.21.11
shaderpack.sodium_version=1.21.11
